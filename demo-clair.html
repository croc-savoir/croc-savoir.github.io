<!doctype html>
<html lang="fr" class="style-cartoon theme-clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Démo thèmes clairs</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cartoon.css">
<style>
  html, body { background: #888 !important; }
  body { padding: 0 0 40px; margin: 0; }
  .intro { padding: 14px 16px; background: #222; color: #fff; font: 14px/1.4 system-ui, sans-serif; position: sticky; top: 0; z-index: 99; }
  .intro b { color: #ffc93c; }
  .theme { padding: 18px 16px 26px; margin: 0; background: var(--bg); color: var(--text); }
  .theme + .theme { border-top: 6px solid #222; }
  .theme > h2 { margin: 0 0 12px; font-size: 17px; color: var(--text); }
  .theme > h2 span { font-weight: 500; font-size: 13px; color: var(--text-muted); }
  .barre { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg-soft); border: 3px solid var(--ink); border-radius: 14px; font-weight: 800; margin-bottom: 12px; }
  .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .mini .home-card, .mini .daily-card { min-height: 70px; padding: 12px; display: block; border-radius: 18px; font-weight: 800; }
  .fiche-list { display: flex; flex-direction: column; gap: 8px; }
  .fiche-list-item { cursor: default; }
  .fiche-card { margin-top: 12px; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* ---- les variantes : seulement des couleurs ---- */
  .t1 { --bg: #efe6d2; --bg-soft: #f6ecd6; --bg-elevated: #f3e6c8; --card: #fbf4e4; --card-hover: #f6ecd6; }
  .t2 { --bg: #e2d7bf; --bg-soft: #ecdfc6; --bg-elevated: #e8d9b9; --card: #f3e9d3; --card-hover: #ede0c6; }
  .t3 { --bg: #dde3ec; --bg-soft: #e7ecf3; --bg-elevated: #dbe3ef; --card: #eef2f8; --card-hover: #e7edf6; }
  .t4 { --bg: #dae9df; --bg-soft: #e5f0e9; --bg-elevated: #d6e8dc; --card: #eef6f0; --card-hover: #e5f0e9; }
  .t5 { --bg: #d9d8dc; --bg-soft: #e5e4e8; --bg-elevated: #dddce1; --card: #ecebee; --card-hover: #e5e4e8; }
  .t6 { --bg: #ecdcdc; --bg-soft: #f4e8e7; --bg-elevated: #efdcd8; --card: #f8eeed; --card-hover: #f4e8e7; }
</style>
</head>
<body>
<div class="intro"><b>Thème clair : 6 variantes.</b> Descends pour les comparer. Dis-moi le numéro qui te plaît (ou « entre 1 et 2 », « plus foncé que 3 »…). L'actuel est le n° 0.</div>
<div id="out"></div>
<script>
const VAR = [
  ['t0', '0 · Actuel (blanc)', 'celui que tu trouves trop fort'],
  ['t1', '1 · Crème', 'papier ivoire, le plus proche de l\'actuel mais chaud'],
  ['t2', '2 · Sable', 'plus foncé, ton parchemin'],
  ['t3', '3 · Bleu gris', 'froid, ardoise claire'],
  ['t4', '4 · Menthe', 'vert très doux'],
  ['t5', '5 · Gris perle', 'neutre, le plus sobre'],
  ['t6', '6 · Rosé', 'rose poudré'],
];
document.getElementById('out').innerHTML = VAR.map(([c, nom, desc]) => `
  <section class="theme ${c}">
    <h2>${nom} <span>— ${desc}</span></h2>
    <div class="barre">‹ &nbsp; Fiches · Par thème</div>
    <div class="mini">
      <div class="home-card home-card--fiches">📖 Fiches</div>
      <div class="daily-card">🍔 Bouchée du jour</div>
    </div>
    <div class="fiche-list">
      <div class="fiche-list-item"><span class="fiche-list-item__title">1914 : Le début de la Première Guerre mondiale</span><span class="fiche-list-item__type">Date clé <span class="niveau n1">Incontournable</span></span></div>
      <div class="fiche-list-item"><span class="fiche-list-item__title">Winston Churchill</span><span class="fiche-list-item__type">Personnage <span class="niveau n2">Approfondi</span></span></div>
    </div>
    <div class="fiche-card">
      <div class="fiche-card__type">🎬 Personnage · Réalisateurs</div>
      <h3 class="fiche-card__title">Éric Toledano</h3>
      <div class="fiche-card__niveau"><span class="niveau n1">Incontournable</span></div>
      <div class="fiche-card__summary"><p>Éric Toledano écrit et réalise tous ses films avec son complice Olivier Nakache. Cinéphile nourri de comédies italiennes, il aime faire rire avec des sujets graves.</p></div>
    </div>
    <div class="btnrow">
      <button class="opt-btn" style="flex:1 1 40%">Socrate</button>
      <button class="opt-btn is-correct" style="flex:1 1 40%">Parménide</button>
      <button class="opt-btn is-wrong" style="flex:1 1 40%">Aristote</button>
      <button class="btn btn-primary" style="flex:1 1 40%">Valider</button>
    </div>
  </section>`).join('');
</script>
</body>
</html>
