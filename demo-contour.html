<!DOCTYPE html>
<html lang="fr" class="style-cartoon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Démo liseré des icônes — Croc'Savoir</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cartoon.css">
<style>
  /* Page de démo temporaire : à supprimer une fois le choix fait (demo-contour.html). */
  .demo { max-width: 560px; margin: 0 auto; padding: 14px 16px 70px; position: relative; z-index: 1; }
  .demo h1 { font-size: 24px; margin: 6px 0 4px; font-family: var(--font-display); }
  .lead { color: var(--text-muted); font-size: 14.5px; margin: 0 0 8px; }
  .opt { margin: 26px 0 6px; }
  .opt h2 { font-size: 17px; margin: 0; font-family: var(--font-display); }
  .opt p { margin: 3px 0 12px; font-size: 13px; color: var(--text-faint); }
  .opt .domain-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .opt .domain-tile { pointer-events: none; min-height: 96px; }
  .opt .domain-tile__emoji img { display: block; width: 44px; height: 44px; margin: -5px; }
  .note { color: var(--text-faint); font-size: 12.5px; margin-top: 26px; }
  /* les variantes (le filtre s'applique à l'image) */
  html.style-cartoon .o1 .domain-tile__emoji img { filter: drop-shadow(1.3px 0 0 #fff) drop-shadow(-1.3px 0 0 #fff) drop-shadow(0 1.3px 0 #fff) drop-shadow(0 -1.3px 0 #fff); }
  html.style-cartoon .o2 .domain-tile__emoji img { filter: none; }
  html.style-cartoon .o3 .domain-tile__emoji img { filter: drop-shadow(.8px 0 0 rgba(255,255,255,.7)) drop-shadow(-.8px 0 0 rgba(255,255,255,.7)) drop-shadow(0 .8px 0 rgba(255,255,255,.7)) drop-shadow(0 -.8px 0 rgba(255,255,255,.7)); }
  html.style-cartoon .o4 .domain-tile__emoji img { filter: none; }
  html.style-cartoon .o4 .domain-tile { background: linear-gradient(90deg, var(--g) 0 7px, #596273 7px); }
  html.style-cartoon .o5 .domain-tile__emoji img { filter: none; }
  html.style-cartoon .o5 .domain-tile__emoji { background: #e9edf3; border-radius: 14px; padding: 6px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; }
  html.style-cartoon .o5 .domain-tile__emoji img { width: 40px; height: 40px; margin: 0; }
</style>
</head>
<body>
<div class="demo">
  <h1>Le liseré blanc des icônes</h1>
  <p class="lead">Les icônes ont un contour noir d'origine, qui se perd sur le fond sombre. Voici cinq façons de les traiter, sur les mêmes thèmes.</p>
  <div id="liste"></div>

  <h2 style="margin-top:30px">Le nouveau dragon (accueil)</h2>
  <button class="home-card home-card--dragon" type="button" style="pointer-events:none;width:100%"><span class="home-card__icon"><img src="icons/dessins/dragon.svg" width="56" height="56" alt=""></span><span class="home-card__text"><span class="home-card__title">Dragon Tour</span><span class="home-card__desc">Drapeaux et capitales du monde</span></span></button>
  <p class="note">Page temporaire, non liée à l'appli.</p>
</div>
<script>
  var OPTIONS = [
    ['o1', '1 · Liseré blanc (actuel)', 'Un fin trait blanc autour de chaque icône, effet autocollant.'],
    ['o2', '2 · Sans liseré', 'L\'icône telle quelle : le trait noir se fond dans le fond sombre.'],
    ['o3', '3 · Liseré blanc plus fin et plus doux', 'Un trait blanc très fin et un peu transparent.'],
    ['o4', '4 · Sans liseré, fond de tuile plus clair', 'Le fond de la tuile s\'éclaircit pour que le trait noir se voie.'],
    ['o5', '5 · Sans liseré, petite plaque claire derrière l\'icône', 'Une plaque arrondie claire derrière chaque icône (comme les anciennes cases).']
  ];
  var EXEMPLES = ['histoire', 'politique', 'religions', 'sciences', 'art', 'sport'];
  fetch('data/domains.json').then(function (r) { return r.json(); }).then(function (d) {
    var par = {}; d.forEach(function (x) { par[x.id] = x; });
    var tuiles = EXEMPLES.map(function (id) { return par[id]; }).filter(Boolean).map(function (x) {
      return '<div class="domain-tile" data-g="' + x.groupe + '"><span class="domain-tile__emoji"><img src="icons/openmoji/' + x.id + '.svg" alt=""></span><span class="domain-tile__label">' + x.label + '</span><span class="domain-tile__count">100 fiches</span></div>';
    }).join('');
    document.getElementById('liste').innerHTML = OPTIONS.map(function (o) {
      return '<section class="opt ' + o[0] + '"><h2>' + o[1] + '</h2><p>' + o[2] + '</p><div class="domain-grid">' + tuiles + '</div></section>';
    }).join('');
  });
</script>
</body>
</html>
