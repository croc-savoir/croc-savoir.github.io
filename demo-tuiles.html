<!DOCTYPE html>
<html lang="fr" class="style-cartoon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Démo tuiles de thèmes — Croc'Savoir</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cartoon.css">
<style>
  /* Page de démo temporaire : à supprimer une fois le choix fait (demo-tuiles.html). */
  .demo { max-width: 560px; margin: 0 auto; padding: 14px 16px 70px; position: relative; z-index: 1; }
  .demo h1 { font-size: 24px; margin: 6px 0 4px; font-family: var(--font-display); }
  .lead { color: var(--text-muted); font-size: 14.5px; margin: 0 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .legend span { padding: 5px 11px; border: 2.5px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 12.5px; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .opt { margin: 26px 0 6px; }
  .opt h2 { font-size: 17px; margin: 0; font-family: var(--font-display); }
  .opt p { margin: 3px 0 12px; font-size: 13px; color: var(--text-faint); }
  .opt .domain-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .note { color: var(--text-faint); font-size: 12.5px; margin-top: 26px; }

  /* Base commune : tuile ardoise, contour noir, ombre nette ; chaque variante ajoute SA façon de montrer la couleur du groupe */
  html.style-cartoon .opt .domain-tile { pointer-events: none; position: relative; overflow: hidden; background: var(--card);
    border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); margin-bottom: 0; --g: var(--g-monde); }
  html.style-cartoon .opt .domain-tile[data-g="vivant"] { --g: var(--g-vivant); }
  html.style-cartoon .opt .domain-tile[data-g="arts"] { --g: var(--g-arts); }
  html.style-cartoon .opt .domain-tile[data-g="monde"] { --g: var(--g-monde); }
  html.style-cartoon .opt .domain-tile__count { color: var(--text-faint); }

  /* 1 · Contour fin tout autour */
  html.style-cartoon .v1 .domain-tile { border: 2px solid var(--g); box-shadow: 0 0 0 2px var(--ink), 0 5px 0 2px var(--ink); }
  /* 2 · Bande fine en haut */
  html.style-cartoon .v2 .domain-tile { padding-top: 22px; background: linear-gradient(var(--g) 0 6px, var(--card) 6px); }
  /* 3 · Bande fine en haut + contour fin */
  html.style-cartoon .v3 .domain-tile { padding-top: 22px; background: linear-gradient(var(--g) 0 6px, var(--card) 6px); border: 2px solid var(--g); box-shadow: 0 0 0 2px var(--ink), 0 5px 0 2px var(--ink); }
  /* 4 · Bande fine à gauche */
  html.style-cartoon .v4 .domain-tile { padding-left: 24px; background: linear-gradient(90deg, var(--g) 0 7px, var(--card) 7px); }
  /* 5 · Fond teinté + contour fin */
  html.style-cartoon .v5 .domain-tile { background: color-mix(in srgb, var(--g) 22%, var(--card)); border: 2px solid var(--g); box-shadow: 0 0 0 2px var(--ink), 0 5px 0 2px var(--ink); }
  /* 6 · Coin coloré en haut à droite */
  html.style-cartoon .v6 .domain-tile::after { content: ''; position: absolute; right: 0; top: 0; width: 38px; height: 38px; background: linear-gradient(225deg, var(--g) 0 50%, transparent 50%); }
  /* 7 · Pastille ronde devant le nom */
  html.style-cartoon .v7 .domain-tile__label::before { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--g); border: 2px solid var(--ink); margin-right: 7px; vertical-align: 1px; }
  /* 8 · Soulignement épais sous le nom */
  html.style-cartoon .v8 .domain-tile__label { display: inline-block; padding-bottom: 3px; border-bottom: 4px solid var(--g); }
  /* 9 · Étiquette de groupe en ruban en bas */
  html.style-cartoon .v9 .domain-tile { padding-bottom: 36px; }
  html.style-cartoon .v9 .domain-tile::after { content: attr(data-nom); position: absolute; left: 0; bottom: 0; right: 0; padding: 4px 10px; background: var(--g); color: var(--ink); font-weight: 800; font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; border-top: 3px solid var(--ink); }
  /* 10 · Logo posé sur un grand aplat de couleur (en haut) */
  html.style-cartoon .v10 .domain-tile { padding-top: 10px; background: linear-gradient(var(--g) 0 46px, var(--card) 46px); }
  html.style-cartoon .v10 .domain-tile__label { margin-top: 6px; }
</style>
</head>
<body>
<div class="demo">
  <h1>Les tuiles de thèmes</h1>
  <p class="lead">Dix façons de montrer la couleur du groupe, toutes sur le même exemple de six thèmes. Fais défiler et dis-moi tes numéros préférés (on peut aussi combiner).</p>
  <div class="legend"><span style="background:var(--g-monde)">Monde &amp; société</span><span style="background:var(--g-vivant)">Sciences &amp; vivant</span><span style="background:var(--g-arts)">Arts &amp; divertissement</span></div>
  <div id="liste"></div>
  <p class="note">Page temporaire, non liée à l'appli.</p>
</div>
<script>
  var OPTIONS = [
    ['v1', '1 · Contour fin tout autour', 'Un trait de la couleur du groupe qui entoure la tuile, plus fin qu\'avant.'],
    ['v2', '2 · Bande fine en haut', 'Une petite bande de couleur en haut de la tuile.'],
    ['v3', '3 · Bande fine en haut + contour fin', 'Le contour coloré et la bande en haut ensemble.'],
    ['v4', '4 · Bande fine à gauche', 'Comme un marque-page sur le côté.'],
    ['v5', '5 · Fond teinté + contour fin', 'La tuile prend une teinte douce de son groupe.'],
    ['v6', '6 · Coin coloré', 'Un petit triangle de couleur dans l\'angle.'],
    ['v7', '7 · Pastille devant le nom', 'Un petit rond de couleur, discret, devant le nom du thème.'],
    ['v8', '8 · Soulignement coloré', 'Le nom du thème est souligné d\'un trait épais.'],
    ['v9', '9 · Ruban de groupe en bas', 'Un ruban qui écrit le nom du groupe : plus clair pour comprendre le code couleur.'],
    ['v10', '10 · Grand aplat derrière le logo', 'Le logo se pose sur un bandeau de couleur en haut de la tuile.']
  ];
  var NOMS = { monde: 'Monde & société', vivant: 'Sciences & vivant', arts: 'Arts & divertissement' };
  var EXEMPLES = ['histoire', 'geo', 'sciences', 'animaux', 'cinema', 'musique'];
  fetch('data/domains.json').then(function (r) { return r.json(); }).then(function (d) {
    var par = {}; d.forEach(function (x) { par[x.id] = x; });
    var tuiles = EXEMPLES.map(function (id) { return par[id]; }).filter(Boolean).map(function (x) {
      return '<div class="domain-tile" data-g="' + x.groupe + '" data-nom="' + NOMS[x.groupe] + '"><span class="domain-tile__emoji">' + x.emoji + '</span><span class="domain-tile__label">' + x.label + '</span><span class="domain-tile__count">100 fiches</span></div>';
    }).join('');
    document.getElementById('liste').innerHTML = OPTIONS.map(function (o) {
      return '<section class="opt ' + o[0] + '"><h2>' + o[1] + '</h2><p>' + o[2] + '</p><div class="domain-grid">' + tuiles + '</div></section>';
    }).join('');
  });
</script>
</body>
</html>
