<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Croc'Savoir — Quiz et fiches de culture générale</title>
<meta name="description" content="Fiches et quiz de culture générale, hors-ligne, sans compte.">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Croc'Savoir">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="view-root">

  <!-- ===== ACCUEIL ===== -->
  <section class="screen screen--home" data-screen="home">
    <div class="home-hero">
      <img class="home-hero__logo" src="icons/icon-192.png" alt="">
      <h1 class="home-hero__title">Croc'Savoir</h1>
      <p class="home-hero__subtitle" id="home-greeting">Un peu de culture, à ton rythme.</p>
    </div>

    <div class="home-choices">
      <button class="home-card home-card--fiches" type="button" data-go="fiches-menu">
        <span class="home-card__icon">📖</span>
        <span class="home-card__text">
          <span class="home-card__title">Fiches</span>
          <span class="home-card__desc">Lire et apprendre, fiche par fiche</span>
        </span>
        <span class="home-card__meta" id="home-fiches-meta"></span>
      </button>
      <button class="home-card home-card--quiz" type="button" data-go="quiz-menu">
        <span class="home-card__icon">🧠</span>
        <span class="home-card__text">
          <span class="home-card__title">Quiz</span>
          <span class="home-card__desc">Tester ce que tu sais</span>
        </span>
        <span class="home-card__meta" id="home-quiz-meta"></span>
      </button>
    </div>

    <div class="home-footer">
      <button class="home-link" type="button" id="btn-stats">📊 Mes statistiques</button>
      <button class="home-link" type="button" id="btn-errors">🔁 Revoir mes erreurs</button>
    </div>
  </section>

  <!-- ===== CHOIX DU MODE : FICHES ===== -->
  <section class="screen" data-screen="fiches-menu" data-title="Fiches" data-back="home" hidden>
    <p class="mode-intro">Comment veux-tu explorer ?</p>
    <div class="mode-list">
      <button class="mode-card" type="button" data-go="fiches-aleatoire">
        <span class="mode-card__icon">🎲</span>
        <span class="mode-card__text">
          <span class="mode-card__title">Aléatoire</span>
          <span class="mode-card__desc">Une fiche au hasard, tous thèmes confondus. Laisse-toi surprendre.</span>
        </span>
        <span class="mode-card__arrow">›</span>
      </button>
      <button class="mode-card" type="button" data-go="fiches-theme">
        <span class="mode-card__icon">🗂️</span>
        <span class="mode-card__text">
          <span class="mode-card__title">Par thème</span>
          <span class="mode-card__desc">Choisis un domaine, puis un sous-thème et la fiche qui t'intéresse.</span>
        </span>
        <span class="mode-card__arrow">›</span>
      </button>
    </div>
  </section>

  <!-- ===== CHOIX DU MODE : QUIZ ===== -->
  <section class="screen" data-screen="quiz-menu" data-title="Quiz" data-back="home" hidden>
    <p class="mode-intro">Quel type de quiz ?</p>
    <div class="mode-list">
      <button class="mode-card" type="button" data-go="quiz-aleatoire">
        <span class="mode-card__icon">🎲</span>
        <span class="mode-card__text">
          <span class="mode-card__title">Aléatoire</span>
          <span class="mode-card__desc">Des questions de tous les thèmes, en priorité celles que tu dois revoir.</span>
        </span>
        <span class="mode-card__arrow">›</span>
      </button>
      <button class="mode-card" type="button" data-go="quiz-theme">
        <span class="mode-card__icon">🗂️</span>
        <span class="mode-card__text">
          <span class="mode-card__title">Par thème</span>
          <span class="mode-card__desc">Choisis un domaine et un format de question.</span>
        </span>
        <span class="mode-card__arrow">›</span>
      </button>
    </div>
  </section>

  <!-- ===== CONTENUS ===== -->
  <section class="screen" data-screen="fiches-aleatoire" data-title="Fiches · Aléatoire" data-back="fiches-menu" hidden>
    <div id="fiches-aleatoire-card" class="card-stage"></div>
  </section>

  <section class="screen" data-screen="fiches-theme" data-title="Fiches · Par thème" data-back="fiches-menu" hidden>
    <div id="fiches-theme-content"></div>
  </section>

  <section class="screen" data-screen="quiz-aleatoire" data-title="Quiz · Aléatoire" data-back="quiz-menu" hidden>
    <div class="card-stage" id="quiz-aleatoire-stage"></div>
  </section>

  <section class="screen" data-screen="quiz-theme" data-title="Quiz · Par thème" data-back="quiz-menu" hidden>
    <div id="quiz-theme-content"></div>
  </section>

  <!-- ===== STATS (overlay) ===== -->
  <section id="view-stats" class="view--overlay" hidden>
    <div id="stats-content"></div>
  </section>

</main>

<!-- Barre de titre des écrans intérieurs -->
<header class="screen-bar" id="screen-bar" hidden>
  <button class="screen-bar__back" id="screen-back" type="button" aria-label="Retour">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <span class="screen-bar__title" id="screen-title"></span>
  <button class="screen-bar__home" id="screen-home" type="button" aria-label="Accueil">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>
  </button>
</header>

<div id="toast" class="toast" hidden></div>

<script src="js/storage.js"></script>
<script src="js/srs.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/quiz-generators.js"></script>
<script src="js/fiches.js"></script>
<script src="js/quiz.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
