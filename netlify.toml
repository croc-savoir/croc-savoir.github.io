# Croc'Savoir sur Netlify : le site est statique (rien à construire), plus quelques fonctions pour le rappel quotidien.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Dossiers de travail : inutiles en ligne
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Le service worker doit toujours être revalidé
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
